[package]
name = "snapious-core"
version = "0.1.0"
edition = "2021"
description = "Rechenkern von Snapious: Modell, Formate, Algorithmen, Klonierung (ohne Oberfläche)"

[dependencies]
rayon = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
