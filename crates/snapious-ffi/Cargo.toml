[package]
name = "snapious-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI-Schnittstelle des Snapious-Kerns für Swift"

[lib]
name = "snapious_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[dependencies]
snapious-core = { path = "../snapious-core" }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
